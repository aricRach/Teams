<div class="select-group-container">
<div class="column-center">

  <header><h3>Select group</h3></header>

  <section class="gap in-row">
<select [(ngModel)]="selectedGroup">
  @for(group of groups(); track group.name; let i=$index) {
    <option [ngValue]="group">
      {{ group.name }}
    </option>
  }
</select>
    @if(selectedGroup) {
      <button class="active-btn action-btn" (click)="submit()">Continue</button>
    }

  </section>
</div>


</div>


<footer>
  @if (isSuperAdmin) {
    <a routerLink="/create-group" class="link-btn">+ Create New Group</a>
  }
  <button (click)="logout()">Logout</button>
</footer>
