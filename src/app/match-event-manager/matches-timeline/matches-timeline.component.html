<app-data-layout
  heading="Matches Timeline"
  [loading]="matchTimelineService.isLoading()"
  [error]="matchTimelineService.hasError()"
  errorHeading="Couldn't load matches"
  [empty]="matchTimelineService.hasNoMatches()"
  emptyHeading="No matches found for selected date."
  (retry)="matchTimelineService.reload()">
  @if (matchTimelineService.availableDates().length) {
    <app-date-filter
      layout-toolbar
      [dates]="matchTimelineService.availableDates()"
      [selectedDate]="matchTimelineService.selectedDate()"
      (dateSelected)="matchTimelineService.onDateChange($event)" />
  }

  <div class="match-panels">
    @for (panel of matchTimelineService.matchPanelsData(); track panel.slot) {
      <app-game-slot-panel
        label="Match"
        [slot]="panel.slot"
        [teamKeys]="panel.teamKeys"
        [score]="panel.score"
        [scorers]="panel.scorers"
        [squad]="panel.squad"
        [aliases]="panel.aliases"
        [showTimer]="false"
        [mode]="panel.mode"
      ></app-game-slot-panel>
    }
  </div>
</app-data-layout>
