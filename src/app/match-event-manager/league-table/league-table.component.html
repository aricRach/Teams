<app-data-layout
  heading="League Table"
  [loading]="league.isLoading()"
  [error]="league.hasError()"
  errorHeading="Couldn't load standings"
  [empty]="league.hasNoLeagueGames()"
  emptyHeading="No league games have been played yet."
  (retry)="league.reload()">
  @if (!league.isLoading() && !league.hasError() && !league.hasNoLeagueGames()) {
    <app-date-filter
      layout-toolbar
      [dates]="league.availableDates()"
      [selectedDate]="league.selectedDate()"
      (dateSelected)="league.onDateChange($event)" />
  }

  <app-league-standings [rows]="league.rows()" [title]="league.selectedDate()" [aliases]="league.dateAliases()" [colors]="league.dateColors()" />
</app-data-layout>
