@if (showSkeleton()) {
  <app-game-board-skeleton [teamCount]="teamCount()" />
} @else if (!loading()) {
  <header class="layout-header">
    <div class="layout-header-start"><ng-content select="[board-start]" /></div>
    <div class="layout-header-center"><ng-content select="[board-center]" /></div>
    <div class="layout-header-end"><ng-content select="[board-end]" /></div>
  </header>

  <ng-content />
}
