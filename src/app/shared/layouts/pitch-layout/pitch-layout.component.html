<div class="pitch-layout-toolbar"><ng-content select="[layout-toolbar]" /></div>

@if (showSkeleton()) {
  <app-team-of-the-week-skeleton />
} @else if (!loading()) {
  @if (error()) {
    <app-state-message kind="error" [heading]="errorHeading()" (actionClicked)="retry.emit()" />
  } @else if (empty()) {
    <app-state-message kind="empty" [heading]="emptyHeading()" [detail]="emptyDetail()" />
  } @else {
    <ng-content />
  }
}
