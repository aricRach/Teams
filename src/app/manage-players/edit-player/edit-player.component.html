<app-form-layout heading="Edit player details">
  <app-generic-form
    [class.form-is-pending]="editPlayerService.isSavingDetails()"
    [formFields]=editPlayerService.controls()
    [additionalTemplate]="deleteBtn"
    (formSubmit)="editPlayerService.editPlayer($event)">
  </app-generic-form>
</app-form-layout>

<ng-template #deleteBtn>
  @if(editPlayerService.selectedPlayer()) {
    <button type=button class="delete-btn active-btn alert-btn"
            [disabled]="editPlayerService.isDeleting()" [class.is-pending]="editPlayerService.isDeleting()"
            (click)="editPlayerService.deletePlayer()">Delete Player</button>
  }
</ng-template>
