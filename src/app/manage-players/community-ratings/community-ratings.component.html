  <header>
    <div class="center">share this link in your group to rate players:</div>
    <section>
    <div>{{communityRatingsService.inviteUrl()}}</div>
    <button class="whatsapp-btn" (click)="communityRatingsService.shareOnWhatsApp()">
      <img src="assets/icons/whatsapp.svg" alt="whatsapp">
    </button>
    </section>
  </header>

  <main>
  @if(communityRatingsService.dataRows().length > 0) {
    <section>
      <app-grid
        [changeToListInSmallScreens]="false"
        [showPaginator]="false"
        [config]="communityRatingsService.config()"
        [columns]="communityRatingsService.columns()"
        [dataRows]="communityRatingsService.dataRows()"
        [actions]="[]"></app-grid>
    </section>
    <div class="center">
      <button class="active-btn submit-btn" [disabled]="communityRatingsService.saveRatings.pending()" [class.is-pending]="communityRatingsService.saveRatings.pending()"
              (click)="communityRatingsService.updateCommunityRatings()">Submit</button>
    </div>
  } @else {

    <h2>There are no available ratings - please ask your team to rate the players</h2>
  }
  </main>

  @if(communityRatingsService.dataRows().length > 0) {
    <footer>
    <section>
      <button (click)="communityRatingsService.deleteRatings()" class="alert-btn active-btn"
              [disabled]="communityRatingsService.deleteAllRatings.pending()" [class.is-pending]="communityRatingsService.deleteAllRatings.pending()">Delete current community ratings</button>
    </section>
  </footer>
  }
