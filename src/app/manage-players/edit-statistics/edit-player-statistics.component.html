<app-form-layout [heading]="editStatisticsService.showForm() ? editStatisticsService.editStatisticsFormTitle() : undefined">
  @if(editStatisticsService.showForm()) {
    <app-generic-form
      [class.form-is-pending]="editStatisticsService.saveCorrection.pending()"
      [formFields]=editStatisticsService.gameControls()
      (formSubmit)="editStatisticsService.editLastStatistics($event)">
    </app-generic-form>
  } @else {
    <app-state-message kind="empty" heading="This player has not played yet, nothing to edit" />
  }
</app-form-layout>
