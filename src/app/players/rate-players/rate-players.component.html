@if(isSubmitted()) {
  <h1 class="center">Thank you</h1>
} @else {
  <app-form-layout heading="Rate Players">
    <form id="rate-players-form" [formGroup]="ratings()" (ngSubmit)="submitRatings()">
      @for(player of allPlayers(); track player.id) {
        <div class="player">
          <span>{{ player.name }}</span>
          <select [formControlName]="player.id" class="rating-select">
            @for(num of [5,6,7,8,9,10, 'dont know']; track $index) {
              <option [ngValue]="num">
                {{ num }}
              </option>
            }
          </select>
        </div>
      }
    </form>

    <button
      form-actions
      form="rate-players-form"
      type="submit"
      class="active-btn submit-btn"
      [disabled]="ratePlayersService.isSubmittingRatings() || ratings().invalid"
      [class.is-pending]="ratePlayersService.isSubmittingRatings()">
      Submit Ratings
    </button>
  </app-form-layout>
}
