<p class="center">Create/Edit the fantasy settings for the next game</p>
<app-generic-form
  [class.form-is-pending]="manageFantasyMetaService.saveMeta.pending()"
  [formFields]=manageFantasyMetaService.fantasyMetaFields()

  (formSubmit)="manageFantasyMetaService.submitFantasyMetaData($event)">
</app-generic-form>
