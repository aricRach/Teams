<app-section-layout heading="Fantasy" [tabs]="tabs()">
  <div section-intro class="rules">
    <ul>
      <li>goal = 3</li>
      <li>win  = 2</li>
    </ul>
    <ul>
      <li>conceded < 5 = 3</li>
      <li>captain = X2</li>
    </ul>
  </div>

  @if (isViewer()) {
    <div class="viewer-notice">
      <p>
        You're viewing this group from a shared link. To join fantasy, ask a group admin
        to add <strong>{{ userEmail }}</strong> to your player.
      </p>
      <button class="active-btn action-btn" (click)="copyEmail()">Copy email</button>
    </div>
  }

  <router-outlet />
</app-section-layout>
