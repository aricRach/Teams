<app-board-layout>
  <!-- Separate @if: a block projects into [board-end] only when the button is its single root element. -->
  @if(!editStatisticsService.statisticsService.noDateSelected()) {
    <button board-end class="active-btn alert-btn" (click)="editStatisticsService.deleteDayStatistics()"
            [disabled]="editStatisticsService.voidDay.pending()" [class.is-pending]="editStatisticsService.voidDay.pending()">Delete</button>
  }

  @if(editStatisticsService.statisticsService.noDateSelected()) {
    <app-state-message kind="empty" heading="You must select a date before." />
  } @else {
    <app-players-drag-drop-table
      [clonedTeams]="editStatisticsService.teams()"
      [editStatistics]="true"
      [showStatisticsInput]="true"
      [enableShowRatings]="false"
      [enableMakeBalancedTeams]="false"
      [dateStatistics]="editStatisticsService.statisticsService.getSelectedDate()"
      [playerStatsMap]="editStatisticsService.computedStatsService.statsMap()"
      [isLocked]="false"
      (updateTeamStatistics)="editStatisticsService.updateTeamStatistics($event)"
    ></app-players-drag-drop-table>
  }
</app-board-layout>
