<app-section-layout [tabs]="statisticsService.innerTabs()">
  <app-date-filter
    section-toolbar
    [dates]="statisticsService.allUniqueDates()"
    [selectedDate]="statisticsService.getSelectedDate()"
    (dateSelected)="statisticsService.setSelectedDate($event)" />

  @if (statisticsService.isTableTabActive()) {
    <label section-toolbar>
      show guests
      <input type="checkbox" [checked]="statisticsService.showGuests()" (change)="statisticsService.setShowGuests($event)">
    </label>
  }

  <router-outlet />
</app-section-layout>
