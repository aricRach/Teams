<div class="standings">
  <h3>{{ title() }}</h3>
  @if (rows().length === 0) {
  <p class="empty">No completed games yet.</p>
  } @else {
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="team">Team</th>
          <th>P</th>
          <th>W</th>
          <th>D</th>
          <th>L</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.teamKey) {
        <tr>
          <td class="team">{{ row.teamKey | teamLabel: aliases() }}</td>
          <td>{{ row.played }}</td>
          <td>{{ row.won }}</td>
          <td>{{ row.drawn }}</td>
          <td>{{ row.lost }}</td>
          <td class="pts">{{ row.points }}</td>
        </tr>
        }
      </tbody>
    </table>
  </div>
  }
</div>
